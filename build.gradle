plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '1.0.14'
}

version = '1.0.0'
group = 'com.yourname.activeragdoll'

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = 'activeragdoll'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.65'

    parchment {
        mappingsVersion = '2024.07.28'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'activeragdoll'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'activeragdoll'
        }
    }

    mods {
        activeragdoll {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation name: 'ragdoll_reactions-1.21.1-0.7.0'
}